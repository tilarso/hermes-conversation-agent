name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: "false"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [minimum, stable, prerelease]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test tools
        run: python -m pip install -r requirements-test.txt
      - name: Install minimum supported Home Assistant
        if: matrix.ha == 'minimum'
        run: python -m pip install 'homeassistant==2026.11.0'
      - name: Install latest stable Home Assistant
        if: matrix.ha == 'stable'
        run: python -m pip install --upgrade homeassistant
      - name: Install latest available Home Assistant including prereleases
        if: matrix.ha == 'prerelease'
        run: python -m pip install --upgrade --pre homeassistant
      - name: Install selected Home Assistant conversation dependencies
        run: python scripts/install_ha_test_dependencies.py
      - name: Lint
        run: python -m ruff check custom_components tests scripts
      - name: Test against real Home Assistant
        run: python -m pytest -q
